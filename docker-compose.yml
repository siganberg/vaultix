# Vaultix – self-hosted drive.
# Data (database + everyone's files as plain files) lives in the mounted /data folder.
services:
  vaultix:
    image: vaultix:latest
    build: .
    container_name: vaultix
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      TZ: ${TZ:-UTC}
      # Creates the first admin on the very first start only (ignored afterwards).
      VAULTIX_ADMIN_USER: ${VAULTIX_ADMIN_USER:-admin}
      VAULTIX_ADMIN_PASSWORD: ${VAULTIX_ADMIN_PASSWORD:?set VAULTIX_ADMIN_PASSWORD}
      # auto = mark cookies Secure when behind an HTTPS reverse proxy (X-Forwarded-Proto).
      VAULTIX_COOKIE_SECURE: auto
      VAULTIX_TRASH_DAYS: "30"
    volumes:
      - /DATA/AppData/vaultix:/data
