# Push a tag `vX.Y.Z` (scripts/release.sh does this) → Docker image + installers for every
# platform → GitHub Release whose notes are the annotated tag's message.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.3.0
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: img
        run: |
          V="${TAG#v}"; MINOR="${V%.*}"
          REPOS="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then REPOS="$REPOS $DOCKERHUB_USERNAME/vaultix"; fi
          TAGS=""
          for r in $REPOS; do TAGS="$TAGS,$r:$V,$r:$MINOR,$r:latest"; done
          echo "tags=${TAGS#,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.img.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.description=Vaultix: a small, fast, self-hosted cloud drive
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

  macos:
    name: macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal app + DMG
        run: ./scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/target/release/bundle/nsis/*.exe

  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file
      - name: Build .deb + AppImage
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - name: Headless sync CLI
        run: |
          cargo build --release --locked -p vaultix-sync
          tar -C target/release -czf "vaultix-sync-${TAG#v}-linux-x86_64.tar.gz" vaultix-sync
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/appimage/*.AppImage
            vaultix-sync-*.tar.gz

  release:
    name: Publish GitHub Release
    needs: [docker, macos, windows, linux]
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the annotated tag
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          [ -s notes.md ] || echo "Vaultix ${TAG}" > notes.md
          V="${TAG#v}"
          PULL="\`docker pull ghcr.io/${GITHUB_REPOSITORY,,}:$V\`"
          if [ -n "$DOCKERHUB_USERNAME" ]; then PULL="\`docker pull $DOCKERHUB_USERNAME/vaultix:$V\` or $PULL"; fi
          {
            echo
            echo "---"
            echo "**Server:** $PULL"
            echo
            echo "**Apps:** macOS \`.dmg\` · Windows \`-setup.exe\` · Linux \`.deb\` / \`.AppImage\` (headless: \`vaultix-sync\` CLI). See the [install guide](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#install-the-apps)."
          } >> notes.md
          ls -la dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "Vaultix ${TAG#v}" --notes-file notes.md --verify-tag
          fi
