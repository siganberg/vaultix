# Push a tag `vX.Y.Z` (scripts/release.sh does this) → Docker image + installers for every
# platform → GitHub Release whose notes are the annotated tag's message.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.3.0
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # No build-record artifact: it would break "download all artifacts" in the release job.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: img
        run: |
          V="${TAG#v}"; MINOR="${V%.*}"
          REPOS="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then REPOS="$REPOS $DOCKERHUB_USERNAME/vaultix"; fi
          TAGS=""
          for r in $REPOS; do TAGS="$TAGS,$r:$V,$r:$MINOR,$r:latest"; done
          echo "tags=${TAGS#,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.img.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.description=Vaultix: a small, fast, self-hosted cloud drive
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

  macos:
    name: macOS apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            server-app -> target
      - name: Sync app (universal) + DMG
        run: ./scripts/build-mac.sh
      - name: Server app (universal) + DMG
        run: |
          V="${TAG#v}"
          (cd server-app && npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app)
          STAGE="$(mktemp -d)"
          cp -R "server-app/target/universal-apple-darwin/release/bundle/macos/Vaultix Server.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Vaultix Server" -srcfolder "$STAGE" -ov -format UDZO "dist/VaultixServer-$V.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop -> target
            server-app -> target
      - name: Sync app installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Server app installer
        working-directory: server-app
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp desktop/target/release/bundle/nsis/*.exe out/
          for f in server-app/target/release/bundle/nsis/*.exe; do cp "$f" "out/$(basename "$f" | sed 's/^Vaultix Server/VaultixServer/')"; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
            server-app -> target
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file
      - name: Sync app .deb + AppImage
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - name: Server app .deb + AppImage
        working-directory: server-app
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - name: Headless sync CLI + collect
        run: |
          cargo build --release --locked -p vaultix-sync
          mkdir out
          tar -C target/release -czf "out/vaultix-sync-${TAG#v}-linux-x86_64.tar.gz" vaultix-sync
          cp desktop/target/release/bundle/deb/*.deb desktop/target/release/bundle/appimage/*.AppImage out/
          for f in server-app/target/release/bundle/deb/*.deb server-app/target/release/bundle/appimage/*.AppImage; do
            cp "$f" "out/$(basename "$f" | sed 's/^Vaultix Server/VaultixServer/')"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    name: Publish GitHub Release
    needs: [docker, macos, windows, linux]
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '@(macos|windows|linux)'
          merge-multiple: true
      - name: Release notes from the annotated tag
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          [ -s notes.md ] || echo "Vaultix ${TAG}" > notes.md
          V="${TAG#v}"
          PULL="\`docker pull ghcr.io/${GITHUB_REPOSITORY,,}:$V\`"
          if [ -n "$DOCKERHUB_USERNAME" ]; then PULL="\`docker pull $DOCKERHUB_USERNAME/vaultix:$V\` or $PULL"; fi
          {
            echo
            echo "---"
            echo "**Server:** $PULL"
            echo
            echo "**Downloads:** \`Vaultix…\` is the sync app for each computer; \`VaultixServer…\` hosts a drive without Docker. macOS \`.dmg\` · Windows \`-setup.exe\` · Linux \`.deb\` / \`.AppImage\` (headless: \`vaultix-sync\` CLI). See the [install guide](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#2-install-the-apps)."
          } >> notes.md
          ls -la dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Artifacts keep their folder layout; attach every file, flat.
          mapfile -t FILES < <(find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' \))
          printf '%s\n' "${FILES[@]}"
          [ "${#FILES[@]}" -ge 9 ] || { echo "expected 9 files (2 dmg, 2 exe, 2 deb, 2 AppImage, 1 CLI)"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md --title "Vaultix ${TAG#v}"
          else
            gh release create "$TAG" "${FILES[@]}" --title "Vaultix ${TAG#v}" --notes-file notes.md --verify-tag
          fi
