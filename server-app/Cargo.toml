[package]
name = "vaultix-server-app"
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/siganberg/vaultix"
description = "Run a Vaultix server on your own computer, no Docker needed"

# Standalone (not part of the server workspace), like desktop/.
[workspace]

[[bin]]
name = "vaultix-server-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
dirs = "5"
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vaultix-server = { path = "../server" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
