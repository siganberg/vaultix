<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaultix Server</title>
<link rel="stylesheet" href="common.css">
<style>
  #app { height: 100%; display: flex; flex-direction: column; padding: 22px 24px 18px; overflow-y: auto; }
  #app > * { flex-shrink: 0; }
  .hero { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .hero img { width: 52px; height: 52px; border-radius: 13px; box-shadow: 0 8px 22px rgba(106, 92, 255, .32); flex: none; }
  .hero h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 550; color: var(--muted); margin-top: 3px; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .pill.running i { background: var(--ok); box-shadow: 0 0 0 3px rgba(34, 163, 90, .18); }
  .pill.starting i { background: var(--warn); }
  .pill.error i { background: var(--danger); }
  .hero .btn { margin-left: auto; }

  .welcome { text-align: center; margin: 6px 0 22px; }
  .welcome img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 10px 28px rgba(106, 92, 255, .35); }
  .welcome h1 { font-size: 21px; font-weight: 650; margin: 14px 0 6px; letter-spacing: -.015em; }
  .welcome p { margin: 0; color: var(--muted); line-height: 1.5; }

  .callout { border-radius: 12px; padding: 14px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; background: var(--accent-soft); }
  .callout .t { flex: 1; min-width: 0; }
  .callout b { display: block; margin-bottom: 2px; }
  .callout small { color: var(--muted); font-size: 12px; line-height: 1.45; display: block; }
  .callout.bad { background: rgba(229, 72, 77, .1); }
  .callout.bad b { color: var(--danger); }

  .label { font-size: 11px; font-weight: 650; letter-spacing: .06em; color: var(--faint); margin: 4px 4px 6px; }
  .addr { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; }
  .addr code { flex: 1; min-width: 0; font: 600 14px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; -webkit-user-select: text; }
  .addr + .addr { border-top: 1px solid var(--line); }
  .addr small { color: var(--faint); font-size: 11.5px; flex: none; }
  .port { width: 86px; text-align: center; }
  .foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; gap: 4px; color: var(--faint); font-size: 12px; }
  .foot .sp { flex: 1; }
  .foot .btn { height: 28px; padding: 0 9px; font-size: 12px; color: var(--muted); }
  .grow { flex: 1; }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
