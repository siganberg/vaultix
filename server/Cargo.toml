[package]
name = "vaultix-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/siganberg/vaultix"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
dav-server = { version = "0.11", default-features = false, features = ["localfs"] }
argon2 = "0.5"
axum = "0.8"
blake3 = "1"
filetime = "0.2"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
percent-encoding = "2"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
totp-rs = { version = "5", features = ["qr", "gen_secret"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
time = "0.3"
zip = { version = "2", default-features = false, features = ["time"] }
