<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaultix Settings</title>
<link rel="stylesheet" href="common.css">
<style>
  #app { height: 100%; display: flex; flex-direction: column; }
  .tabs { display: flex; justify-content: center; gap: 4px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px; padding: 7px 0 6px; border-radius: 9px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 500; }
  .tab svg { width: 20px; height: 20px; stroke-width: 1.8; }
  .tab:hover { background: var(--hover); }
  .tab.on { background: var(--accent-soft); color: var(--accent); }
  .body { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .acct { display: flex; align-items: center; gap: 14px; padding: 16px; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #7c6cff, #3a8bff); color: #fff; font-weight: 650; font-size: 19px; text-transform: uppercase; flex: none; }
  .acct .t { flex: 1; min-width: 0; }
  .acct b { font-size: 15px; display: block; }
  .acct small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .confirm { padding: 14px; background: rgba(229, 72, 77, .07); }
  .confirm p { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
  .confirm .btns { display: flex; gap: 8px; justify-content: flex-end; }
  .about { text-align: center; padding-top: 18px; }
  .about img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 10px 28px rgba(106, 92, 255, .32); }
  .about h2 { margin: 14px 0 2px; font-size: 20px; font-weight: 650; }
  .about p { margin: 0; color: var(--muted); }
  .about .btns { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
  .remote { display: flex; align-items: center; gap: 0; }
  .remote .input { width: 200px; text-align: right; }
  .apply { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script src="fileicons.js"></script>
<script src="settings.js"></script>
</body>
</html>
