<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Vaultix</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: var(--bg); }
  .wrap { height: 100%; display: flex; flex-direction: column; padding: 30px 34px 26px; }
  .hero { text-align: center; margin-bottom: 24px; }
  .hero .mark { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 10px 28px rgba(106, 92, 255, .35); margin-bottom: 14px; }
  .hero .ok { width: 64px; height: 64px; border-radius: 50%; display: inline-grid; place-items: center; background: rgba(34, 163, 90, .14); color: var(--ok); margin-bottom: 14px; }
  .hero .ok svg { width: 32px; height: 32px; stroke-width: 2.6; }
  .hero h1 { font-size: 21px; font-weight: 650; margin: 0 0 6px; letter-spacing: -.015em; }
  .hero p { margin: 0; color: var(--muted); line-height: 1.5; }
  .grow { flex: 1; }
  .actions { display: flex; gap: 10px; }
  .actions .btn { flex: 1; height: 40px; font-size: 14px; border-radius: 10px; }
  .check { display: flex; align-items: center; gap: 10px; margin: 6px 2px 0; }
  .hint { color: var(--faint); font-size: 11.5px; margin-top: -8px; margin-bottom: 14px; }
  form { display: contents; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="common.js"></script>
<script src="fileicons.js"></script>
<script src="setup.js"></script>
</body>
</html>
