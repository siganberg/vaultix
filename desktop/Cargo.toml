[package]
name = "vaultix-desktop"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/siganberg/vaultix"
description = "Vaultix desktop sync for Windows and Linux"

# Standalone (not part of the server workspace) so the server's Docker build never pulls in Tauri.
[workspace]

[[bin]]
name = "vaultix"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
vaultix-sync = { path = "../client" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
