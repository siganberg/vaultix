[package]
name = "vaultix-sync"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "vaultix-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
filetime = "0.2"
fs2 = "0.4"
hostname = "0.4"
notify = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
unicode-normalization = "0.1"
urlencoding = "2"
walkdir = "2"
